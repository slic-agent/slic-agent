# Standard family, in-distribution test set (832 tasks: 33 topologies x 24 + single_ended_telescopic_pmos_LG_pmos_biasn_LV x 40): the main Table 1 protocol.
model_path: models/my-slic-random   # REQUIRED: your HF-format checkpoint (docs/REPRODUCE.md, "Checkpoints")
tasks: data/standard/test_iid.parquet
run_tag: slic_random_qwen3.5_4b_standard_iid
protocol:
  max_turns: 8
  history_length: 1
  samples_per_task: 3
  temperature: 0.7
  batch_size: 208                      # parallel environments; divides the task count
  pass_at_ks: [1, 3]
  reward_preset: sparse_constraint_done_4spec_hint
  think_prefilled: true               # Qwen3 / Qwen3.5 checkpoints; false for Qwen2.5
  max_response_length: 2048
  tech_node: 65nm
env: {}
overrides: []
