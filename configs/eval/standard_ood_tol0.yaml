# Standard family, out-of-distribution test set under the 0 %-TOLERANCE protocol: same checkpoint and tasks as
# standard_ood.yaml, but every spec tolerance is 0 (targets stated at 0 % in the prompt, auto-stop only at exact success). Its
# rollouts give tools/analysis/tolerance_sweep.py exact success rates below the official 5 % tolerance.
model_path: models/my-slic-random   # REQUIRED: your HF-format checkpoint (docs/REPRODUCE.md, "Checkpoints")
tasks: data/standard/test_ood.parquet
run_tag: slic_random_qwen3.5_4b_standard_ood_tol0
protocol:
  max_turns: 8
  history_length: 1
  samples_per_task: 3
  temperature: 0.7
  batch_size: 140                      # parallel environments; divides the task count
  pass_at_ks: [1, 3]
  reward_preset: sparse_constraint_done_4spec_hint_tol0eval   # every spec tolerance 0 %
  think_prefilled: true               # Qwen3 / Qwen3.5 checkpoints; false for Qwen2.5
  max_response_length: 2048
  tech_node: 65nm
env: {}
overrides: []
