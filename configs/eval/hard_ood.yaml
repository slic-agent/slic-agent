# Hard family, OOD test (280 tasks, 7 held-out topologies x 40).
model_path: models/qwen3.5-4b-slic-random   # the released checkpoint (README, "Model"), or your own HF-format one (docs/REPRODUCE.md, "Checkpoints")
tasks: data/hard/test_ood.parquet
run_tag: slic_random_qwen3.5_4b_hard_ood
protocol:
  max_turns: 8
  history_length: 1
  samples_per_task: 3
  temperature: 0.7
  batch_size: 140                      # parallel environments; divides the task count
  pass_at_ks: [1, 3]
  reward_preset: sparse_constraint_done_4spec_hint
  think_prefilled: true               # Qwen3 / Qwen3.5 checkpoints; false for Qwen2.5
  max_response_length: 2048
  tech_node: 65nm
env: {}
overrides: []
