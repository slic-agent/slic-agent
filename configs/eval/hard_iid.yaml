# Hard family, IID test (436 tasks): one of the four specifications starts far from its target.
model_path: models/my-slic-random   # REQUIRED: your HF-format checkpoint (docs/REPRODUCE.md, "Checkpoints")
tasks: data/hard/test_iid.parquet
run_tag: slic_random_qwen3.5_4b_hard_iid
protocol:
  max_turns: 8
  history_length: 1
  samples_per_task: 3
  temperature: 0.7
  batch_size: 109                      # parallel environments; divides the task count
  pass_at_ks: [1, 3]
  reward_preset: sparse_constraint_done_4spec_hint
  think_prefilled: true               # Qwen3 / Qwen3.5 checkpoints; false for Qwen2.5
  max_response_length: 2048
  tech_node: 65nm
env: {}
overrides: []
