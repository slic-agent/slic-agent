# Standard family, out-of-distribution topologies, evaluated WITHOUT the optimisation hint in the prompt: the protocol for
# the no-gates/no-hint ablation (configs/train/abl_no_gates.yaml). Identical to configs/eval/standard_ood.yaml except the
# reward preset (prompt style goal_no_hint; success verdict unchanged).
model_path: models/my-abl-no-gates   # REQUIRED: your converted no-gates checkpoint (docs/REPRODUCE.md, Checkpoints)
tasks: data/standard/test_ood.parquet
run_tag: abl_no_gates_qwen3.5_4b_standard_ood_nohint
protocol:
  max_turns: 8
  history_length: 1
  samples_per_task: 3
  temperature: 0.7
  batch_size: 140                      # parallel environments; divides the task count
  pass_at_ks: [1, 3]
  reward_preset: sparse_constraint_done_4spec_nohint
  think_prefilled: true               # Qwen3 / Qwen3.5 checkpoints; false for Qwen2.5
  max_response_length: 2048
  tech_node: 65nm
env: {}
overrides: []
